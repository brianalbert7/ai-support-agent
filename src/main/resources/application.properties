spring.application.name=ai-support-agent
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.embedding.model=text-embedding-3-small
spring.ai.openai.embedding.dimensions=1536
spring.ai.openai.chat.model=${OPENAI_CHAT_MODEL:gpt-5-mini}
spring.ai.openai.chat.max-completion-tokens=${OPENAI_CHAT_MAX_COMPLETION_TOKENS:600}
spring.ai.openai.chat.reasoning-effort=${OPENAI_CHAT_REASONING_EFFORT:low}
spring.ai.openai.chat.store=false

app.security.jwt.secret=${JWT_SECRET}
app.security.jwt.issuer=ai-support-agent
app.security.jwt.access-token-expiration=15m

app.storage.documents.directory=${DOCUMENT_STORAGE_PATH:./data/documents}
app.storage.documents.max-file-size=${DOCUMENT_MAX_FILE_SIZE:10MB}

app.rag.chunking.target-tokens=${RAG_CHUNK_TARGET_TOKENS:500}
app.rag.chunking.minimum-size-characters=${RAG_CHUNK_MINIMUM_SIZE_CHARACTERS:200}
app.rag.chunking.minimum-length-to-embed=${RAG_CHUNK_MINIMUM_LENGTH_TO_EMBED:5}
app.rag.chunking.maximum-chunks-per-page=${RAG_MAX_CHUNKS_PER_PAGE:100}

app.rag.embedding.dimensions=1536
app.rag.embedding.batch-size=${RAG_EMBEDDING_BATCH_SIZE:100}

app.rag.search.default-results=${RAG_SEARCH_DEFAULT_RESULTS:5}
app.rag.search.minimum-similarity=${RAG_SEARCH_MINIMUM_SIMILARITY:0.70}

app.conversation.history.max-messages=${CONVERSATION_HISTORY_MAX_MESSAGES:10}
app.conversation.history.max-characters=${CONVERSATION_HISTORY_MAX_CHARACTERS:12000}

spring.servlet.multipart.max-file-size=${DOCUMENT_MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${DOCUMENT_MAX_REQUEST_SIZE:11MB}

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=${SPRINGDOC_SWAGGER_UI_ENABLED:true}
springdoc.swagger-ui.document-title=AI Support Agent API
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.api-docs.enabled=${SPRINGDOC_API_DOCS_ENABLED:true}
springdoc.api-docs.version=OPENAPI_3_0

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true

logging.level.org.springframework.security=DEBUG
