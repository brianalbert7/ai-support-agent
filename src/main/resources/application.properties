spring.application.name=ai-support-agent
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.ai.openai.api-key=${OPENAI_API_KEY}

app.security.jwt.secret=${JWT_SECRET}
app.security.jwt.issuer=ai-support-agent
app.security.jwt.access-token-expiration=15m

app.storage.documents.directory=${DOCUMENT_STORAGE_PATH:./data/documents}
app.storage.documents.max-file-size=${DOCUMENT_MAX_FILE_SIZE:10MB}

app.rag.chunking.target-tokens=${RAG_CHUNK_TARGET_TOKENS:500}
app.rag.chunking.minimum-size-characters=${RAG_CHUNK_MINIMUM_SIZE_CHARACTERS:200}
app.rag.chunking.minimum-length-to-embed=${RAG_CHUNK_MINIMUM_LENGTH_TO_EMBED:5}
app.rag.chunking.maximum-chunks-per-page=${RAG_MAX_CHUNKS_PER_PAGE:100}

spring.servlet.multipart.max-file-size=${DOCUMENT_MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${DOCUMENT_MAX_REQUEST_SIZE:11MB}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true

logging.level.org.springframework.security=DEBUG
