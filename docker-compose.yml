services:
  postgres:
    image: pgvector/pgvector:0.8.2-pg16
    container_name: support-postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USERNAME:?Set DB_USERNAME in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-supportdb}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: ai-support-agent:local
    container_name: ai-support-agent
    restart: always
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-supportdb}
      DB_USERNAME: ${DB_USERNAME:?Set DB_USERNAME in .env}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Set OPENAI_API_KEY in .env}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-gpt-5-mini}
      OPENAI_CHAT_MAX_COMPLETION_TOKENS: ${OPENAI_CHAT_MAX_COMPLETION_TOKENS:-600}
      OPENAI_CHAT_REASONING_EFFORT: ${OPENAI_CHAT_REASONING_EFFORT:-low}
      DOCUMENT_STORAGE_PATH: /app/data/documents
      DOCUMENT_MAX_FILE_SIZE: ${DOCUMENT_MAX_FILE_SIZE:-10MB}
      DOCUMENT_MAX_REQUEST_SIZE: ${DOCUMENT_MAX_REQUEST_SIZE:-11MB}
      RAG_CHUNK_TARGET_TOKENS: ${RAG_CHUNK_TARGET_TOKENS:-500}
      RAG_CHUNK_MINIMUM_SIZE_CHARACTERS: ${RAG_CHUNK_MINIMUM_SIZE_CHARACTERS:-200}
      RAG_CHUNK_MINIMUM_LENGTH_TO_EMBED: ${RAG_CHUNK_MINIMUM_LENGTH_TO_EMBED:-5}
      RAG_MAX_CHUNKS_PER_PAGE: ${RAG_MAX_CHUNKS_PER_PAGE:-100}
      RAG_EMBEDDING_BATCH_SIZE: ${RAG_EMBEDDING_BATCH_SIZE:-100}
      RAG_SEARCH_DEFAULT_RESULTS: ${RAG_SEARCH_DEFAULT_RESULTS:-5}
      RAG_SEARCH_MINIMUM_SIMILARITY: ${RAG_SEARCH_MINIMUM_SIMILARITY:-0.70}
      CONVERSATION_HISTORY_MAX_MESSAGES: ${CONVERSATION_HISTORY_MAX_MESSAGES:-10}
      CONVERSATION_HISTORY_MAX_CHARACTERS: ${CONVERSATION_HISTORY_MAX_CHARACTERS:-12000}
      SPRINGDOC_API_DOCS_ENABLED: ${SPRINGDOC_API_DOCS_ENABLED:-true}
      SPRINGDOC_SWAGGER_UI_ENABLED: ${SPRINGDOC_SWAGGER_UI_ENABLED:-true}
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - document-data:/app/data/documents
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:?Set PGADMIN_DEFAULT_EMAIL in .env}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?Set PGADMIN_DEFAULT_PASSWORD in .env}
    ports:
      - "${PGADMIN_PORT:-5050}:80"

volumes:
  postgres-data:
  document-data:
